# Nginx site configuration for Elite Hub
# Replace YOUR_DOMAIN_HERE with your real domain before enabling this file.
#
# Deployment topology:
#   - Cloudflare handles HTTPS termination (SSL/TLS mode: Full)
#   - Nginx serves HTTP on port 80 to Cloudflare's edge
#   - /api/v1/* proxied to the Node.js backend (PM2, port 5000)
#   - Everything else served from the React SPA static build
#
# After editing:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"         always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
    # CSP: adjust script-src if you load scripts from additional origins
    add_header Content-Security-Policy
        "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.paystack.co https://api.ng.termii.com"
        always;

    # ── Gzip ─────────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml image/svg+xml;

    # ── API — proxy to Node.js backend ───────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — provider calls can take up to 20s; give a comfortable margin
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Disable buffering for streaming responses (AI support widget)
        proxy_buffering off;
    }

    # ── Webhook endpoints — same proxy, higher body size limit ────────────
    location /api/v1/webhooks/ {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Paystack and Monnify send large webhook payloads
        client_max_body_size 1m;
    }

    # ── eSIM QR code images — private, authenticated via backend ─────────
    # These are served through /api/v1/esim/orders/:id/qrcode which the
    # backend handles with res.sendFile() — no separate static route needed.

    # ── React SPA static files ────────────────────────────────────────────
    root  /var/www/elite-hub;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets (Vite content-hashes filenames)
    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # Never cache the SPA entry point — it must always return the latest build
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma        "no-cache";
        add_header Expires       "0";
    }

    # ── Deny hidden files ─────────────────────────────────────────────────
    location ~ /\. {
        deny all;
    }
}
